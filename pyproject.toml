[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-archie"
version = "2.0.0a2"
description = "Local evidence-gated D&D player assistant with Open5e V2 source discovery"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
archie = "archie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archie*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
